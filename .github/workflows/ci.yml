name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/download_assets.py --models yolox_nano yolox_tiny
      - run: python scripts/quantize.py models/yolox_tiny.onnx
      - run: python -m pytest -q
      - name: Smoke-test the real-time pipeline (headless, synthetic camera)
        run: python run_realtime.py --source synthetic --headless --frames 60 --model models/yolox_tiny.int8-static.onnx
      - name: Quick benchmark (numbers from a shared CI runner are noisy - use for regressions only)
        run: python benchmark.py --quick --only breakdown realtime --out results/ci
      - uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark
          path: results/ci
